<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Helper</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Главный экран -->
    <div id="dashboard" class="page active">
        <header>
            <h1>Helper</h1>
            <button onclick="showPage('settings')" class="icon-btn">⚙️</button>
        </header>
        
        <div class="card">
            <h2>Сегодня</h2>
            <div class="stats">
                <div class="stat-box">
                    <span class="label">Калории</span>
                    <span class="value" id="cal-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="label">Вода</span>
                    <span class="value" id="water-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="label">Шаги</span>
                    <span class="value" id="steps-value">0</span>
                </div>
            </div>
            <div class="mood-selector" style="margin-top: 16px;">
                <span class="subtitle">Настроение: </span>
                <span id="current-mood" style="font-size: 20px;">—</span>
                <div style="margin-top: 8px; display: flex; justify-content: space-between;">
                    <button class="mood-btn" onclick="setMood('🤩')">🤩</button>
                    <button class="mood-btn" onclick="setMood('🙂')">🙂</button>
                    <button class="mood-btn" onclick="setMood('😐')">😐</button>
                    <button class="mood-btn" onclick="setMood('😫')">😫</button>
                    <button class="mood-btn" onclick="setMood('🤬')">🤬</button>
                </div>
            </div>
        </div>

        <div class="quick-actions">
            <button class="btn primary" onclick="showPage('food')">📸 Записать еду</button>
            <div style="display: flex; gap: 10px;">
                <button class="btn secondary" style="flex:1;" onclick="addCustomWater()">💧 Вода (мл)</button>
                <button class="btn secondary" style="flex:1;" onclick="addCustomSteps()">👟 Шаги</button>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn secondary" style="flex:1;" onclick="showPage('calendar'); renderCalendar();">📅 График</button>
                <button class="btn secondary" style="flex:1;" onclick="showPage('planner'); renderPlanner();">✅ Задачи / Долги</button>
            </div>
        </div>
    </div>

    <!-- Экран еды -->
    <div id="food" class="page">
        <header>
            <button onclick="showPage('dashboard')" class="icon-btn">◀</button>
            <h1>Еда</h1>
            <div style="width: 24px;"></div>
        </header>
        <div class="card">
            <p class="subtitle">Опишите еду текстом ИЛИ прикрепите фото</p>
            <textarea id="food-input" placeholder="Например: 2 вареных яйца..."></textarea>
            
            <input type="file" id="food-image" accept="image/*" class="file-input" onchange="previewImage(event)">
            <img id="image-preview" style="display: none; width: 100%; border-radius: 12px; margin-bottom: 16px;">
            
            <button class="btn primary full-width" onclick="analyzeFood()" id="analyze-btn">✨ Рассчитать</button>
            <div id="food-result" class="result-box hidden"></div>
        </div>
    </div>

    <!-- Планировщик и Долги -->
    <div id="planner" class="page">
        <header>
            <button onclick="showPage('dashboard')" class="icon-btn">◀</button>
            <h1>Планировщик</h1>
            <div style="width: 24px;"></div>
        </header>
        
        <!-- Задачи -->
        <div class="card">
            <h2>Список дел</h2>
            <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                <input type="text" id="task-input" placeholder="Что нужно сделать?" style="margin-bottom: 0;">
                <button class="btn primary" onclick="addTask()" style="padding: 14px;">+</button>
            </div>
            <div id="tasks-list" class="list-container"></div>
        </div>

        <!-- Долги -->
        <div class="card">
            <h2>Долги</h2>
            <p class="subtitle">Напишите кому и сумму (с минусом, если должны вы)</p>
            <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                <input type="text" id="debt-who" placeholder="Кому / Кто?" style="margin-bottom: 0; flex: 2;">
                <input type="number" id="debt-amount" placeholder="Сумма" style="margin-bottom: 0; flex: 1;">
                <button class="btn primary" onclick="addDebt()" style="padding: 14px;">+</button>
            </div>
            <div id="debts-list" class="list-container"></div>
        </div>
    </div>

    <!-- Календарь смен -->
    <div id="calendar" class="page">
        <header>
            <button onclick="showPage('dashboard')" class="icon-btn">◀</button>
            <h1>График</h1>
            <div style="width: 24px;"></div>
        </header>
        <div class="card">
            <p class="subtitle">Нажимайте на дни: ☀️ День, 🌙 Ночь, 🌴 Выходной</p>
            <h2 id="month-name" style="text-align: center; margin-top: 10px;">Месяц</h2>
            <div class="calendar-grid" id="cal-grid"></div>
        </div>
    </div>

    <!-- Настройки -->
    <div id="settings" class="page">
        <header>
            <button onclick="showPage('dashboard')" class="icon-btn">◀</button>
            <h1>Настройки</h1>
            <div style="width: 24px;"></div>
        </header>
        <div class="card">
            <h2>API Ключ</h2>
            <input type="password" id="api-key-input" placeholder="AIzaSy...">
            <button class="btn primary full-width" onclick="saveApiKey()">Сохранить</button>
        </div>
        <div class="card danger-zone">
            <button class="btn danger full-width" onclick="clearData()">🗑 Очистить все данные</button>
        </div>
    </div>

    <script src="app.js?v=5"></script>
</body>
</html>
