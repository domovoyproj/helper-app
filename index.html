<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Helper</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Главный экран (Дашборд) -->
    <div id="dashboard" class="page active">
        <header>
            <h1>Helper</h1>
            <button onclick="showPage('settings')" class="icon-btn">⚙️</button>
        </header>
        
        <div class="card">
            <h2>Сегодня</h2>
            <div class="stats">
                <div class="stat-box">
                    <span class="label">Калории</span>
                    <span class="value" id="cal-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="label">Вода</span>
                    <span class="value" id="water-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="label">Шаги</span>
                    <span class="value" id="steps-value">0</span>
                </div>
            </div>
            <div class="mood-selector" style="margin-top: 16px;">
                <span class="subtitle">Настроение: </span>
                <span id="current-mood" style="font-size: 20px;">—</span>
                <div style="margin-top: 8px;">
                    <button class="mood-btn" onclick="setMood('😎')">😎</button>
                    <button class="mood-btn" onclick="setMood('😐')">😐</button>
                    <button class="mood-btn" onclick="setMood('😫')">😫</button>
                </div>
            </div>
        </div>

        <div class="quick-actions">
            <button class="btn primary" onclick="showPage('food')">📸 Записать еду (Текст / Фото)</button>
            <div style="display: flex; gap: 10px;">
                <button class="btn secondary" style="flex:1;" onclick="addWater(250)">💧 +250 мл</button>
                <button class="btn secondary" style="flex:1;" onclick="addSteps(1000)">👟 +1000 шаг</button>
            </div>
            <button class="btn secondary" onclick="showPage('calendar'); renderCalendar();">📅 Календарь смен</button>
        </div>
    </div>

    <!-- Экран добавления еды (ИИ + Фото) -->
    <div id="food" class="page">
        <header>
            <button onclick="showPage('dashboard')" class="icon-btn">◀</button>
            <h1>Еда</h1>
            <div style="width: 24px;"></div>
        </header>
        <div class="card">
            <p class="subtitle">Опишите еду текстом ИЛИ прикрепите фото</p>
            <textarea id="food-input" placeholder="Например: 2 вареных яйца..."></textarea>
            
            <input type="file" id="food-image" accept="image/*" class="file-input" onchange="previewImage(event)">
            <img id="image-preview" style="display: none; width: 100%; border-radius: 12px; margin-bottom: 16px;">
            
            <button class="btn primary full-width" onclick="analyzeFood()" id="analyze-btn">✨ Рассчитать</button>
            <div id="food-result" class="result-box hidden"></div>
        </div>
    </div>

    <!-- Календарь смен -->
    <div id="calendar" class="page">
        <header>
            <button onclick="showPage('dashboard')" class="icon-btn">◀</button>
            <h1>График</h1>
            <div style="width: 24px;"></div>
        </header>
        <div class="card">
            <p class="subtitle">Нажимайте на дни, чтобы ставить смены (☀️ День, 🌙 Ночь, 🌴 Выходной)</p>
            <h2 id="month-name" style="text-align: center; margin-top: 10px;">Месяц</h2>
            <div class="calendar-grid" id="cal-grid">
                <!-- Дни добавятся через JS -->
            </div>
        </div>
    </div>

    <!-- Настройки -->
    <div id="settings" class="page">
        <header>
            <button onclick="showPage('dashboard')" class="icon-btn">◀</button>
            <h1>Настройки</h1>
            <div style="width: 24px;"></div>
        </header>
        <div class="card">
            <h2>API Ключ</h2>
            <input type="password" id="api-key-input" placeholder="AIzaSy...">
            <button class="btn primary full-width" onclick="saveApiKey()">Сохранить</button>
        </div>
        <div class="card danger-zone">
            <button class="btn danger full-width" onclick="clearData()">🗑 Очистить все данные</button>
        </div>
    </div>

    <script src="app.js?v=4"></script>
</body>
</html>
